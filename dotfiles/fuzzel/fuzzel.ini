# Fuzzel Configuration
# Designed for deep frosted glass aesthetic with dual vertical & horizontal navigation

[main]
font = JetBrainsMono Nerd Font:size=10
dpi-aware = yes
icon-theme = buuf-nestort
icons-enabled = yes
namespace = fuzzel

# Dimensions & Roomy Layout
width = 32
lines = 6
line-height = 22
tabs = 4
horizontal-pad = 14
vertical-pad = 10
inner-pad = 6
image-size-ratio = 0.0

# Prompt & Search
prompt = "❯ "
placeholder = "Search applications..."
terminal = "wezterm -e"
layer = top
keyboard-focus = on-demand
exit-on-keyboard-focus-loss = yes

# Window positioning: Centered on screen
anchor = center
x-margin = 0
y-margin = 0

[colors]
# Matching rofi theme.rasi glass colors (Format: RRGGBBAA)
# bg-glass: rgba(0, 0, 0, 0.45) -> 00000073
background = 00000073
# text: #FFFFFF -> ffffffff
text = ffffffff
# prompt / placeholder / counter
prompt = b0b0b0ff
placeholder = b0b0b0aa
# Active item highlight: rgba(255, 255, 255, 0.08) -> ffffff14
selection = ffffff18
selection-text = ffffffff
# Border rim reflection: rgba(255, 255, 255, 0.12) -> ffffff1f
border = ffffff24
match = ffb4abff
selection-match = ffb4abff

[border]
width = 1
radius = 12
selection-radius = 8

[dmenu]
mode = text
exit-immediately-if-empty = no

[key-bindings]
cancel = Escape Control+g Control+c
execute = Return KP_Enter
execute-or-next = Tab
execute-input = Shift+Return

# Dual Vertical Navigation (Up / Down, Ctrl+P / Ctrl+N, Ctrl+K / Ctrl+J)
delete-line-forward = none
prev = Up Control+p Control+k
prev-with-wrap = ISO_Left_Tab
next = Down Control+n Control+j

# Dual Horizontal Navigation (Left / Right)
cursor-left = none
cursor-right = none
cursor-left-word = Control+Left
cursor-right-word = Control+Right
prev-page = Page_Up Left
next-page = Page_Down Right
