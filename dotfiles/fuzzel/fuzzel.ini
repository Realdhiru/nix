# Fuzzel Configuration
# Designed for deep frosted glass aesthetic with dual vertical & horizontal navigation

[main]
font = JetBrainsMono Nerd Font:size=10
dpi-aware = yes
icon-theme = buuf-nestort
icons-enabled = yes
match-mode = fzf
namespace = fuzzel

# Dimensions & Roomy Layout
width = 32
lines = 6
line-height = 22
tabs = 4
horizontal-pad = 14
vertical-pad = 10
inner-pad = 6
image-size-ratio = 0.5

# Prompt & Search
prompt = "❯ "
placeholder = "Search applications..."
terminal = "wezterm -e"
layer = top
keyboard-focus = exclusive
exit-on-keyboard-focus-loss = yes

# Window positioning: Centered on screen
anchor = center
x-margin = 0
y-margin = 0

[colors]
# Transparent liquid glass aesthetic matching QuickShell (Format: RRGGBBAA)
background = 12131833
text = EDE6DCff
input = EDE6DCff
prompt = C9BFB5ff
placeholder = A89F95aa
selection = ffffff18
selection-text = EDE6DCff
border = 00000000
match = f66370ff
selection-match = f66370ff

[border]
width = 0
radius = 16
selection-radius = 10

[dmenu]
mode = text
exit-immediately-if-empty = no

[key-bindings]
cancel = Escape Control+g Control+c
execute = Return KP_Enter
execute-or-next = Tab
execute-input = Shift+Return

# Dual Vertical Navigation (Up / Down, Ctrl+P / Ctrl+N, Ctrl+K / Ctrl+J)
delete-line-forward = none
prev = Up Control+p Control+k
prev-with-wrap = ISO_Left_Tab
next = Down Control+n Control+j

# Dual Horizontal Navigation (Left / Right)
cursor-left = none
cursor-right = none
cursor-left-word = Control+Left
cursor-right-word = Control+Right
prev-page = Page_Up Left
next-page = Page_Down Right
