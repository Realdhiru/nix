# Wallust v3.5 - High-Vibrancy Systemwide Theme Engine
# Backend options: "resized" (default, fast/vibrant), "wal", "thumb", "kmeans"
backend = "resized"
# Colorspace options: "salience" (best contrast), "lch", "lab", "rgb", "hsl"
color_space = "salience"
# Palette options: "saliencedark16" (dark mode), "saliencelight16" (light mode), "dark16", "softdark16"
palette = "saliencedark16"
check_contrast = true

[templates]
colors = { template = "colors.json", target = "~/.cache/theme/colors.json" }
wezterm = { template = "wezterm-colors.lua", target = "~/.cache/theme/wezterm-colors.lua" }
cava = { template = "cava", target = "~/.config/cava/themes/wallust" }
gtk = { template = "gtk.css", target = "~/.cache/theme/gtk.css" }
qtct = { template = "qtct.conf", target = "~/.cache/theme/qtct.conf" }
qt_style = { template = "qt-style.qss", target = "~/.cache/theme/qt-style.qss" }
hyprland = { template = "hyprland-colors.conf", target = "~/.cache/theme/hyprland-colors.conf" }
