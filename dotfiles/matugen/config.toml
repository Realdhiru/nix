[config]
reload_apps = false
fallback_color = "#808080"

[templates.quickshell]
input_path = "~/nix/dotfiles/matugen/templates/qs_colors.json.template"
output_path = "~/.cache/matugen/qs_colors.json"

[templates.wezterm]
input_path = "~/nix/dotfiles/matugen/templates/wezterm-colors.lua.template"
output_path = "~/.cache/matugen/wezterm-colors.lua"

[templates.gtk]
input_path = "~/nix/dotfiles/matugen/templates/gtk.css.template"
output_path = "~/.cache/matugen/gtk.css"

[templates.qtct]
input_path = "~/nix/dotfiles/matugen/templates/qtct.conf.template"
output_path = "~/.cache/matugen/qtct.conf"

[templates.qt-style]
input_path = "~/nix/dotfiles/matugen/templates/qt-style.qss.template"
output_path = "~/.cache/matugen/qt-style.qss"

[templates.cava]
input_path = "~/nix/dotfiles/matugen/templates/cava.template"
output_path = "~/.config/cava/themes/matugen"