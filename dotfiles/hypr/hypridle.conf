general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/power.sh lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/power.sh resume
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Idle dimming: dim screen to 10% and turn off keyboard backlight
listener {
    timeout = 90 # 1.5 minutes
    on-timeout = brightnessctl -s set 10% && ~/.config/hypr/scripts/power.sh keyboard-backlight off
    on-resume = brightnessctl -r && ~/.config/hypr/scripts/power.sh keyboard-backlight restore
}

# 2. Lock session before screen turns completely black
listener {
    timeout = 120 # 2 minutes
    on-timeout = loginctl lock-session
}

# 3. Turn off display (DPMS off)
listener {
    timeout = 130 # 2 minutes + 10s grace
    on-timeout = timeout 3 hyprctl eval "hl.dispatch(hl.dsp.dpms({action='off'}))"
    on-resume = timeout 3 hyprctl eval "hl.dispatch(hl.dsp.dpms({action='on'}))" && brightnessctl -r && ~/.config/hypr/scripts/power.sh keyboard-backlight restore
}

# 4. Suspend system after 30m idle
listener {
    timeout = 1800 # 30 minutes of idle inactivity
    on-timeout = systemctl suspend
}
