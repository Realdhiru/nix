general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/power.sh lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/power.sh resume
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 120
    on-timeout = hyprctl eval "hl.dispatch(hl.dsp.dpms({action='off'}))"
    on-resume = hyprctl eval "hl.dispatch(hl.dsp.dpms({action='on'}))"
}

listener {
    timeout = 180 # 3 minutes
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800 # 30 minutes of idle inactivity
    on-timeout = systemctl suspend
}