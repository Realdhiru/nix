[general]
bars = 8
framerate = 60
autosens = 1
sensitivity = 70
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[smoothing]
integral = 70
monstercat = 1
waves = 0
gravity = 100

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = stereo