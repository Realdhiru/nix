# Hyprlock configuration - Fast GPU-accelerated lockscreen
source = ~/.cache/theme/hyprland-colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 3, default
    animation = fadeOut, 1, 2, default
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = $active_border_col_1
    inner_color = rgba(18, 19, 24, 0.75)
    font_color = rgb(237, 230, 220)
    fade_on_empty = false
    placeholder_text = <span font_desc="JetBrains Mono 10" foreground="##8b8781">Enter password...</span>
    hide_input = false
    rounding = 12
    check_color = $active_border_col_1
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(237, 230, 220)
    font_size = 76
    font_family = JetBrains Mono ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(237, 230, 220, 0.75)
    font_size = 18
    font_family = JetBrains Mono Medium
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] hyprctl splash
    color = rgba(237, 230, 220, 0.6)
    font_size = 13
    font_family = JetBrains Mono Italic
    position = 0, 40
    halign = center
    valign = bottom
}

