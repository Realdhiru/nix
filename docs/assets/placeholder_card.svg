<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="410" height="240">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>
    <linearGradient id="pShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform 
        attributeName="gradientTransform" 
        type="translate" 
        from="-410,0" 
        to="410,0" 
        dur="2.2s" 
        repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect width="408" height="238" x="1" y="1" rx="12" fill="url(#pBg)" stroke="#282f3c" stroke-width="1.2" />
  <rect width="408" height="238" x="1" y="1" rx="12" fill="url(#pShimmer)" />

  <!-- Center Icon -->
  <g transform="translate(205, 105)">
    <circle cx="0" cy="0" r="26" fill="#1b212c" stroke="#374151" stroke-width="1.2" />
    <!-- Image / Camera Icon -->
    <path d="M-10,-6 h5 l2,-3 h6 l2,3 h5 a2,2 0 0,1 2,2 v12 a2,2 0 0,1 -2,2 h-20 a2,2 0 0,1 -2,-2 v-12 a2,2 0 0,1 2,-2 z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="0" cy="2" r="4" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Text -->
  <text x="205" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    Preview Screenshot
  </text>
  <text x="205" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Capturing workflow preview...
  </text>
</svg>
