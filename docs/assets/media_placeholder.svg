<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 478" width="850" height="478">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>

    <!-- Moving Shimmer Wave -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform 
        attributeName="gradientTransform" 
        type="translate" 
        from="-850,0" 
        to="850,0" 
        dur="1.8s" 
        repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="848" height="476" x="1" y="1" rx="16" fill="url(#bgGrad)" stroke="#2b313d" stroke-width="1.5" />

  <!-- Shimmer Overlay Layer -->
  <rect width="848" height="476" x="1" y="1" rx="16" fill="url(#shimmer)" />

  <!-- Top Bar Mockup Header -->
  <rect x="25" y="20" width="800" height="28" rx="8" fill="#1d222d" opacity="0.7" />
  <circle cx="42" cy="34" r="5" fill="#465166" />
  <circle cx="58" cy="34" r="5" fill="#465166" />
  <circle cx="74" cy="34" r="5" fill="#465166" />
  <rect x="360" y="26" width="130" height="16" rx="4" fill="#2c3444" />

  <!-- Center Loading / Media Icon -->
  <g transform="translate(425, 220)">
    <!-- Pulse Ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#52b788" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="34;48;34" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="32" fill="#1c2330" stroke="#52b788" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Monitor / Play Glyph -->
    <path d="M-12,-10 h24 a2,2 0 0,1 2,2 v14 a2,2 0 0,1 -2,2 h-24 a2,2 0 0,1 -2,-2 v-14 a2,2 0 0,1 2,-2 z" fill="none" stroke="#52b788" stroke-width="1.8" />
    <path d="M-4,8 v4 h8 v-4 M-8,12 h16" fill="none" stroke="#52b788" stroke-width="1.8" stroke-linecap="round" />
    <polygon points="-3,-5 5,-1 -3,3" fill="#52b788" />
  </g>

  <!-- Typography -->
  <text x="425" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">
    Desktop Showcase Media
  </text>
  <text x="425" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">
    Loading high-definition preview...
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
  </text>
</svg>
